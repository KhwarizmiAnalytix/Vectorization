name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Linux x86_64 CPU: every x86 CPU SIMD backend, gcc + clang, Release; one
  # Debug canary per compiler. VECTORIZATION_GPU_BACKEND=none.
  # ---------------------------------------------------------------------------
  linux-cpu:
    name: Linux CPU / ${{ matrix.compiler }} / ${{ matrix.cpu_backend }} / ${{ matrix.build_type }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        cpu_backend: [no, sse, avx, avx2, avx512]
        build_type: [Release]
        include:
          - compiler: gcc
            cpu_backend: avx2
            build_type: Debug
          - compiler: clang
            cpu_backend: avx2
            build_type: Debug
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Select compiler
        run: |
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            echo "CC=gcc" >> "$GITHUB_ENV"
            echo "CXX=g++" >> "$GITHUB_ENV"
          else
            echo "CC=clang" >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          fi

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DVECTORIZATION_CPU_BACKEND=${{ matrix.cpu_backend }}
          -DVECTORIZATION_GPU_BACKEND=none
          -DVECTORIZATION_ENABLE_TESTING=ON
          -DVECTORIZATION_ENABLE_BENCHMARK=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # ---------------------------------------------------------------------------
  # Linux AArch64 CPU: NEON and SVE, via QEMU-backed cross toolchain is out of
  # scope (no aarch64 GitHub-hosted runner tier); covered on macOS below
  # (NEON) and skipped for SVE, which macOS's own AArch64 does not implement.
  # SVE therefore has no runner in this workflow -- validate it locally on an
  # SVE-capable Linux host, or self-host a runner labeled [self-hosted,
  # linux, arm64, sve].
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # Linux CUDA: build-only. GitHub-hosted runners have no NVIDIA GPU, so this
  # job installs nvcc (no driver/device required to compile) and configures
  # + builds against explicit CUDA_ARCHITECTURES, then skips ctest -- there is
  # no device to run the tests on. Requires a self-hosted GPU runner to
  # actually execute VectorizationCxxTests under CUDA.
  # ---------------------------------------------------------------------------
  linux-cuda:
    name: Linux GPU / CUDA (build-only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja + CUDA toolkit (nvcc only, no driver/device needed)
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build nvidia-cuda-toolkit
          nvcc --version

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DVECTORIZATION_CPU_BACKEND=avx2
          -DVECTORIZATION_GPU_BACKEND=cuda
          -DCMAKE_CUDA_ARCHITECTURES=75
          -DVECTORIZATION_ENABLE_TESTING=ON
          -DVECTORIZATION_ENABLE_BENCHMARK=OFF

      - name: Build
        run: cmake --build build

      - name: Note on test execution
        run: |
          echo "Skipping ctest: no NVIDIA GPU on this runner. Build-only verification of the CUDA backend."

  # ---------------------------------------------------------------------------
  # Linux HIP: build-only. GitHub-hosted runners have no AMD GPU, so this job
  # installs hipcc/ROCm from AMD's apt repo (compiler only, no driver/device
  # required) and skips ctest. Requires a self-hosted GPU runner to actually
  # execute VectorizationCxxTests under HIP. HIP is Unix-only in this project.
  # ---------------------------------------------------------------------------
  linux-hip:
    name: Linux GPU / HIP (build-only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja + ROCm/hipcc (compiler only, no driver/device needed)
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build wget gnupg
          wget -qO - https://repo.radeon.com/rocm/rocm.gpg.key | sudo gpg --dearmor -o /etc/apt/keyrings/rocm.gpg
          echo "deb [signed-by=/etc/apt/keyrings/rocm.gpg] https://repo.radeon.com/rocm/apt/latest $(. /etc/os-release && echo $UBUNTU_CODENAME) main" | sudo tee /etc/apt/sources.list.d/rocm.list
          sudo apt-get update
          sudo apt-get install -y hip-dev
          echo "ROCM_PATH=/opt/rocm" >> "$GITHUB_ENV"
          echo "/opt/rocm/bin" >> "$GITHUB_PATH"

      - name: Verify hipcc
        run: hipcc --version

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DVECTORIZATION_CPU_BACKEND=avx2
          -DVECTORIZATION_GPU_BACKEND=hip
          -DCMAKE_HIP_ARCHITECTURES=gfx90a
          -DVECTORIZATION_ENABLE_TESTING=ON
          -DVECTORIZATION_ENABLE_BENCHMARK=OFF

      - name: Build
        run: cmake --build build

      - name: Note on test execution
        run: |
          echo "Skipping ctest: no AMD GPU on this runner. Build-only verification of the HIP backend."

  # ---------------------------------------------------------------------------
  # macOS AArch64 CPU: 'no' and NEON. macos-latest runners are Apple Silicon
  # (arm64), so this is the only hosted NEON coverage in this workflow.
  # ---------------------------------------------------------------------------
  macos-cpu:
    name: macOS CPU / ${{ matrix.cpu_backend }}
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        cpu_backend: [no, neon]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja
        run: brew install ninja

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DVECTORIZATION_CPU_BACKEND=${{ matrix.cpu_backend }}
          -DVECTORIZATION_GPU_BACKEND=none
          -DVECTORIZATION_ENABLE_TESTING=ON
          -DVECTORIZATION_ENABLE_BENCHMARK=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # ---------------------------------------------------------------------------
  # macOS Metal: real GPU backend, fully build + run on-device. Apple Silicon
  # macos-latest runners have a real Metal-capable GPU, unlike CUDA/HIP above.
  # ---------------------------------------------------------------------------
  macos-metal:
    name: macOS GPU / Metal
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja
        run: brew install ninja

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DVECTORIZATION_CPU_BACKEND=neon
          -DVECTORIZATION_GPU_BACKEND=metal
          -DVECTORIZATION_ENABLE_TESTING=ON
          -DVECTORIZATION_ENABLE_BENCHMARK=OFF

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # ---------------------------------------------------------------------------
  # Windows x86_64 CPU: MSVC, every x86 CPU SIMD backend, Release.
  # ---------------------------------------------------------------------------
  windows-cpu:
    name: Windows CPU / ${{ matrix.cpu_backend }}
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        cpu_backend: [no, sse, avx, avx2, avx512]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: >
          cmake -S . -B build
          -DVECTORIZATION_CPU_BACKEND=${{ matrix.cpu_backend }}
          -DVECTORIZATION_GPU_BACKEND=none
          -DVECTORIZATION_ENABLE_TESTING=ON
          -DVECTORIZATION_ENABLE_BENCHMARK=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

  # ---------------------------------------------------------------------------
  # Optional numerical backends: SLEEF (NEON, macOS), Apple Accelerate vForce
  # (NEON, macOS), USE_NATIVE_ARCH (-march=native), LibTorch comparison
  # tests, and the SIMD packet-size / SVE vector-width knobs. Each is a
  # cheap, independent axis -- see "one option at a time" in the CI design.
  # SVML and MKL are intentionally NOT covered here: SVML requires Intel's
  # proprietary SVML library and MKL requires the oneAPI MKL SDK, neither of
  # which this workflow installs; validate those locally
  # (`setup.py config.build.test.svml` / `.mkl`) where the SDK is available.
  # ---------------------------------------------------------------------------
  optional-backends:
    name: Optional / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: sleef-neon
            os: macos-latest
            cmake_flags: -DVECTORIZATION_CPU_BACKEND=neon -DVECTORIZATION_ENABLE_SLEEF=ON
          - name: accelerate-neon
            os: macos-latest
            cmake_flags: -DVECTORIZATION_CPU_BACKEND=neon -DVECTORIZATION_ENABLE_ACCELERATE=ON
          - name: native-arch
            os: ubuntu-latest
            cmake_flags: -DVECTORIZATION_CPU_BACKEND=avx2 -DUSE_NATIVE_ARCH=ON
          - name: packet-size-4
            os: ubuntu-latest
            cmake_flags: -DVECTORIZATION_CPU_BACKEND=avx2 -DVECTORIZATION_PACKET_SIZE=4
          - name: sve-256
            os: ubuntu-latest
            cmake_flags: -DVECTORIZATION_CPU_BACKEND=sve -DVECTORIZATION_SVE_VECTOR_BITS=256
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DVECTORIZATION_GPU_BACKEND=none
          -DVECTORIZATION_ENABLE_TESTING=ON
          -DVECTORIZATION_ENABLE_BENCHMARK=OFF
          ${{ matrix.cmake_flags }}

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # ---------------------------------------------------------------------------
  # Toolchain axes: LTO mode, linker choice, C++ standard, compiler cache.
  # Independent, cheap knobs -- each gets its own small matrix entry rather
  # than a combinatorial cross product with the CPU/GPU backend matrices.
  # ---------------------------------------------------------------------------
  toolchain-axes:
    name: Toolchain / ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CC: clang
      CXX: clang++
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: lto-thin
            cmake_flags: -DVECTORIZATION_LTO_MODE=thin
          - name: lto-full
            cmake_flags: -DVECTORIZATION_LTO_MODE=full
          - name: cxx17
            cmake_flags: -DVECTORIZATION_CXX_STANDARD=17
          - name: cxx23
            cmake_flags: -DVECTORIZATION_CXX_STANDARD=23
          - name: linker-lld
            cmake_flags: -DVECTORIZATION_LINKER_CHOICE=lld
          - name: cache-ccache
            cmake_flags: -DVECTORIZATION_ENABLE_CACHE=ON -DVECTORIZATION_CACHE_BACKEND=ccache
            install: ccache
          - name: static-libs
            cmake_flags: -DBUILD_SHARED_LIBS=OFF
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja + lld
        run: sudo apt-get update && sudo apt-get install -y ninja-build lld

      - name: Install ${{ matrix.install }}
        if: matrix.install
        run: sudo apt-get install -y ${{ matrix.install }}

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DVECTORIZATION_CPU_BACKEND=avx2
          -DVECTORIZATION_GPU_BACKEND=none
          -DVECTORIZATION_ENABLE_TESTING=ON
          -DVECTORIZATION_ENABLE_BENCHMARK=OFF
          ${{ matrix.cmake_flags }}

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # ---------------------------------------------------------------------------
  # Static analysis: clang-tidy and include-what-you-use, each their own job
  # so a failure in one doesn't mask the other. Default CPU backend (avx2),
  # GPU backend none.
  # ---------------------------------------------------------------------------
  static-analysis:
    name: Static analysis / ${{ matrix.tool }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CC: clang
      CXX: clang++
    strategy:
      fail-fast: false
      matrix:
        include:
          - tool: clang-tidy
            cmake_flags: -DVECTORIZATION_ENABLE_CLANGTIDY=ON
            install: clang-tidy
          - tool: iwyu
            cmake_flags: -DVECTORIZATION_ENABLE_IWYU=ON
            install: iwyu
          - tool: cppcheck
            cmake_flags: ""
            install: cppcheck
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja + ${{ matrix.install }}
        run: sudo apt-get update && sudo apt-get install -y ninja-build ${{ matrix.install }}

      - name: Configure
        if: matrix.tool != 'cppcheck'
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DVECTORIZATION_CPU_BACKEND=avx2
          -DVECTORIZATION_GPU_BACKEND=none
          -DVECTORIZATION_ENABLE_TESTING=OFF
          -DVECTORIZATION_ENABLE_BENCHMARK=OFF
          ${{ matrix.cmake_flags }}

      - name: Build (clang-tidy / iwyu run inline during compilation)
        if: matrix.tool != 'cppcheck'
        run: cmake --build build

      - name: Cppcheck (via Scripts/setup.py)
        if: matrix.tool == 'cppcheck'
        run: |
          cd Scripts
          python3 setup.py config.build.avx2.cppcheck

  # ---------------------------------------------------------------------------
  # Valgrind: default CPU backend, Debug, executes the test suite under
  # Valgrind memory checking. Linux only (Cmake/tools/valgrind.cmake).
  # ---------------------------------------------------------------------------
  valgrind:
    name: Valgrind
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja + Valgrind
        run: sudo apt-get update && sudo apt-get install -y ninja-build valgrind

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DVECTORIZATION_CPU_BACKEND=avx2
          -DVECTORIZATION_GPU_BACKEND=none
          -DVECTORIZATION_ENABLE_TESTING=ON
          -DVECTORIZATION_ENABLE_BENCHMARK=OFF
          -DVECTORIZATION_ENABLE_VALGRIND=ON

      - name: Build
        run: cmake --build build

      - name: Test under Valgrind
        run: ctest --test-dir build --output-on-failure

  # ---------------------------------------------------------------------------
  # Bazel: builds/tests the whole tree, cross-platform, plus a small CPU
  # backend + Metal smoke matrix exercising bazel/BUILD.bazel's select()
  # logic (see bazel/vectorization.bzl). CUDA/HIP are not exercised here --
  # see Scripts/setup_bazel.py's module docstring (@local_config_{cuda,hip}
  # is not yet defined in this workspace).
  # ---------------------------------------------------------------------------
  bazel:
    name: Bazel / ${{ matrix.os }} / ${{ matrix.cpu_backend }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        cpu_backend: [no]
        include:
          - os: ubuntu-latest
            cpu_backend: avx2
          - os: macos-latest
            cpu_backend: neon
          - os: macos-latest
            cpu_backend: metal
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: bazelbuild/setup-bazelisk@v3

      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel
          key: bazel-${{ runner.os }}-${{ matrix.cpu_backend }}-${{ hashFiles('MODULE.bazel', 'WORKSPACE.bazel', 'BUILD.bazel', 'bazel/**') }}
          restore-keys: |
            bazel-${{ runner.os }}-${{ matrix.cpu_backend }}-
            bazel-${{ runner.os }}-

      - name: Build (default backend)
        if: matrix.cpu_backend == 'no'
        run: bazel build //...

      - name: Test (default backend)
        if: matrix.cpu_backend == 'no'
        run: bazel test //... --test_output=errors

      - name: Build (CPU backend)
        if: matrix.cpu_backend != 'no' && matrix.cpu_backend != 'metal'
        run: bazel build //... --define=vectorization_cpu_backend=${{ matrix.cpu_backend }}

      - name: Test (CPU backend)
        if: matrix.cpu_backend != 'no' && matrix.cpu_backend != 'metal'
        run: bazel test //... --define=vectorization_cpu_backend=${{ matrix.cpu_backend }} --test_output=errors

      - name: Build (Metal GPU backend)
        if: matrix.cpu_backend == 'metal'
        run: bazel build //... --define=vectorization_gpu_backend=metal --define=memory_gpu_backend=metal

      - name: Test (Metal GPU backend)
        if: matrix.cpu_backend == 'metal'
        run: bazel test //... --define=vectorization_gpu_backend=metal --define=memory_gpu_backend=metal --test_output=errors

  # ---------------------------------------------------------------------------
  # Sanitizers: Clang ASan and UBSan, default CPU backend (avx2), Debug.
  # Linux + macOS only -- Cmake/tools/sanitize.cmake requires Clang/GCC and
  # explicitly warns "Sanitizers require GCC or Clang" for MSVC, so Windows
  # is skipped (unsupported by the codebase's own sanitizer module, not a CI
  # gap).
  # ---------------------------------------------------------------------------
  sanitize:
    name: Sanitizer / ${{ matrix.os }} / ${{ matrix.sanitizer }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        sanitizer: [address, undefined]
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DVECTORIZATION_CPU_BACKEND=avx2
          -DVECTORIZATION_GPU_BACKEND=none
          -DVECTORIZATION_ENABLE_TESTING=ON
          -DVECTORIZATION_ENABLE_BENCHMARK=OFF
          -DVECTORIZATION_ENABLE_SANITIZER=ON
          -DVECTORIZATION_SANITIZER_TYPE=${{ matrix.sanitizer }}

      - name: Build
        run: cmake --build build

      - name: Test
        env:
          ASAN_OPTIONS: halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build --output-on-failure

  # ---------------------------------------------------------------------------
  # Coverage: gcc/gcov+lcov (Linux), Homebrew LLVM/clang (macOS), MSVC/OpenCppCoverage
  # (Windows). Pass --compiler explicitly: macOS's default /usr/bin/c++ is AppleClang
  # with CMAKE_CXX_COMPILER=/usr/bin/c++, and coverage-tool cannot map that path
  # (no "clang" in the filename) when CMAKE_CXX_COMPILER_ID is not a cache entry.
  # Default CPU backend (avx2), GPU backend none. Codecov upload stays Linux/lcov-only.
  # ---------------------------------------------------------------------------
  coverage:
    name: Coverage / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CC: ${{ matrix.os == 'ubuntu-latest' && 'gcc' || '' }}
      CXX: ${{ matrix.os == 'ubuntu-latest' && 'g++' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install tools (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y ninja-build lcov

      - name: Install tools (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install ninja llvm
          LLVM_PREFIX="$(brew --prefix llvm)"
          echo "${LLVM_PREFIX}/bin" >> "$GITHUB_PATH"
          echo "CC=${LLVM_PREFIX}/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=${LLVM_PREFIX}/bin/clang++" >> "$GITHUB_ENV"

      - name: Install tools (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install -y opencppcoverage

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install coverage-tool
        run: pip install "git+https://github.com/KhwarizmiAnalytix/coverage-tool.git"

      - name: Configure (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DVECTORIZATION_CPU_BACKEND=avx2
          -DVECTORIZATION_GPU_BACKEND=none
          -DVECTORIZATION_ENABLE_TESTING=ON
          -DVECTORIZATION_ENABLE_BENCHMARK=OFF
          -DVECTORIZATION_ENABLE_COVERAGE=ON

      - name: Configure (Windows)
        if: matrix.os == 'windows-latest'
        run: >
          cmake -S . -B build
          -DVECTORIZATION_CPU_BACKEND=avx2
          -DVECTORIZATION_GPU_BACKEND=none
          -DVECTORIZATION_ENABLE_TESTING=ON
          -DVECTORIZATION_ENABLE_BENCHMARK=OFF
          -DVECTORIZATION_ENABLE_COVERAGE=ON

      - name: Build (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: cmake --build build

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: cmake --build build --config Release

      - name: Test (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: ctest --test-dir build --output-on-failure

      - name: Test (Windows)
        if: matrix.os == 'windows-latest'
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Collect coverage
        run: >
          coverage-tool --build=build
          --compiler=${{ matrix.os == 'windows-latest' && 'msvc' || (matrix.os == 'macos-latest' && 'clang' || 'gcc') }}

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-${{ matrix.os }}
          path: build/coverage_report/html

      - name: Upload to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          files: build/coverage_filtered.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ---------------------------------------------------------------------------
  # Lint: lintrunner over the repository's own configured linters (see
  # .lintrunner.toml).
  # ---------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install lintrunner
        run: |
          pip install lint-tool

      - name: Run lintrunner
        run: |
          python3 -m lintrunner --version
          python3 -m lintrunner init
          python3 -m lintrunner run --show-stats
