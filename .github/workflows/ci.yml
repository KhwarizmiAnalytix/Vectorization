name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Linux x86_64 CPU: every x86 CPU SIMD backend, gcc + clang, Release; one
  # Debug canary per compiler. VECTORIZATION_GPU_BACKEND=none.
  # ---------------------------------------------------------------------------
  linux-cpu:
    name: Linux CPU / ${{ matrix.compiler }} / ${{ matrix.cpu_backend }} / ${{ matrix.build_type }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        cpu_backend: [no, sse, avx, avx2, avx512]
        build_type: [Release]
        include:
          - compiler: gcc
            cpu_backend: avx2
            build_type: Debug
          - compiler: clang
            cpu_backend: avx2
            build_type: Debug
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Select compiler
        run: |
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            echo "CC=gcc" >> "$GITHUB_ENV"
            echo "CXX=g++" >> "$GITHUB_ENV"
          else
            echo "CC=clang" >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          fi

      - name: Configure
        run: >
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --source-dir . --build-dir build --generator Ninja
          --build-type=${{ matrix.build_type }}
          --cpu-backend=${{ matrix.cpu_backend }}
          --gpu-backend=none
          --testing=ON
          --benchmark=ON

      - name: Build
        run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build

      - name: Test
        run: python3 .github/scripts/ctest_cpu.py --backend=${{ matrix.cpu_backend }} --config=${{ matrix.build_type }}

  # ---------------------------------------------------------------------------
  # Linux AArch64 CPU: NEON and SVE, via QEMU-backed cross toolchain is out of
  # scope (no aarch64 GitHub-hosted runner tier); covered on macOS below
  # (NEON) and skipped for SVE, which macOS's own AArch64 does not implement.
  # SVE therefore has no runner in this workflow -- validate it locally on an
  # SVE-capable Linux host, or self-host a runner labeled [self-hosted,
  # linux, arm64, sve].
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # Match Scalars' CUDA toolchain and compile tests and benchmarks for a fixed
  # architecture. Memory links the CUDA driver, so executing even CPU-only
  # tests requires libcuda.so.1, which is absent from this driverless container.
  # ---------------------------------------------------------------------------
  linux-cuda:
    name: Linux GPU / CUDA (build-only)
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.6.2-devel-ubuntu22.04
    timeout-minutes: 60
    steps:
      - name: Install build tools
        # Scalars requires CMake 3.24; Ubuntu 22.04 packages CMake 3.22.
        run: |
          apt-get update && apt-get install -y ninja-build git python3-pip
          python3 -m pip install "cmake>=3.24,<4"
          cmake --version
          nvcc --version

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: >
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --source-dir . --build-dir build --generator Ninja
          --build-type=Release
          --cpu-backend=avx2
          --gpu-backend=cuda
          --lto-mode=off
          --cuda-architectures=75
          --testing=ON
          --benchmark=ON

      - name: Build
        run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build --parallel 4

      - name: Note on test execution
        run: |
          echo "Skipping ctest: Memory requires the NVIDIA driver library (libcuda.so.1), which is absent from this container."

  # ---------------------------------------------------------------------------
  # Match Scalars' ROCm toolchain, compile tests and benchmarks for a fixed
  # architecture, and run unit tests with GPU cases skipping without a device.
  # HIP is Unix-only in this project.
  # ---------------------------------------------------------------------------
  linux-hip:
    name: Linux GPU / HIP (compile + skip-aware test)
    runs-on: ubuntu-latest
    container: rocm/dev-ubuntu-22.04:6.3.1
    timeout-minutes: 60
    steps:
      - name: Install build tools and GPU math dependencies
        run: |
          apt-get update && apt-get install -y ninja-build git python3-pip rocthrust-dev hipblas-dev hipsolver-dev
          python3 -m pip install "cmake>=3.24,<4"
          cmake --version
          /opt/rocm/bin/hipcc --version

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja + ROCm/hipcc (compiler only, no driver/device needed)
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build wget gnupg
          wget -qO - https://repo.radeon.com/rocm/rocm.gpg.key | sudo gpg --dearmor -o /etc/apt/keyrings/rocm.gpg
          echo "deb [signed-by=/etc/apt/keyrings/rocm.gpg] https://repo.radeon.com/rocm/apt/latest $(. /etc/os-release && echo "$UBUNTU_CODENAME") main" | sudo tee /etc/apt/sources.list.d/rocm.list
          # Keep hipcc and the SDK on the same AMD release; Ubuntu also ships hipcc.
          printf 'Package: *\nPin: release o=repo.radeon.com\nPin-Priority: 600\n' | sudo tee /etc/apt/preferences.d/rocm-pin-600
          sudo apt-get update
          sudo apt-get install -y hip-dev hipcc hipblas-dev hipsolver-dev
          echo "ROCM_PATH=/opt/rocm" >> "$GITHUB_ENV"
          echo "/opt/rocm/bin" >> "$GITHUB_PATH"

      - name: Verify hipcc
        run: hipcc --version


      - name: Configure
        run: >
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --source-dir . --build-dir build --generator Ninja
          --build-type=Release
          --cpu-backend=avx2
          --gpu-backend=hip
          --lto-mode=off
          --hip-architectures=gfx90a
          --prefix-path=/opt/rocm
          --hip-arch-options=gfx90a
          --testing=ON
          --benchmark=ON

      - name: Build
        run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build --parallel 4

      - name: Test (GPU cases self-skip without a device)
        run: >
          python3 "${{ github.workspace }}/Scripts/setup.py" test --build-dir . --build-dir build
          --test-timeout 300 -LE Benchmark

  # ---------------------------------------------------------------------------
  # macOS AArch64 CPU: 'no' and NEON. macos-latest runners are Apple Silicon
  # (arm64), so this is the only hosted NEON coverage in this workflow.
  # ---------------------------------------------------------------------------
  macos-cpu:
    name: macOS CPU / ${{ matrix.cpu_backend }}
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        cpu_backend: [no, neon]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja
        run: brew install ninja

      - name: Configure
        run: >
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --source-dir . --build-dir build --generator Ninja
          --build-type=Release
          --cpu-backend=${{ matrix.cpu_backend }}
          --gpu-backend=none
          --testing=ON
          --benchmark=ON

      - name: Build
        run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build

      - name: Test
        run: python3 "${{ github.workspace }}/Scripts/setup.py" test --build-dir . --build-dir build

  # ---------------------------------------------------------------------------
  # macOS Metal: real GPU backend, fully build + run on-device. Apple Silicon
  # macos-latest runners have a real Metal-capable GPU, unlike CUDA/HIP above.
  # ---------------------------------------------------------------------------
  macos-metal:
    name: macOS GPU / Metal
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja
        run: brew install ninja

      - name: Configure
        run: >
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --source-dir . --build-dir build --generator Ninja
          --build-type=Release
          --cpu-backend=neon
          --gpu-backend=metal
          --testing=ON
          --benchmark=OFF

      - name: Build
        run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build

      - name: Test
        run: python3 "${{ github.workspace }}/Scripts/setup.py" test --build-dir . --build-dir build

  # ---------------------------------------------------------------------------
  # Windows x86_64 CPU: MSVC, every x86 CPU SIMD backend, Release.
  # ---------------------------------------------------------------------------
  windows-cpu:
    name: Windows CPU / ${{ matrix.cpu_backend }}
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        cpu_backend: [no, sse, avx, avx2, avx512]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: >
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --generator=default --source-dir . --build-dir build
          --cpu-backend=${{ matrix.cpu_backend }}
          --gpu-backend=none
          --testing=ON
          --benchmark=ON

      - name: Build
        run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build --build-type Release

      - name: Test
        run: python .github/scripts/ctest_cpu.py --backend=${{ matrix.cpu_backend }}

  # ---------------------------------------------------------------------------
  # Optional numerical backends: SLEEF (NEON, macOS), Apple Accelerate vForce
  # (NEON, macOS), USE_NATIVE_ARCH (-march=native), LibTorch comparison
  # tests, and the SIMD packet-size / SVE vector-width knobs. Each is a
  # cheap, independent axis -- see "one option at a time" in the CI design.
  # SVML and MKL are intentionally NOT covered here: SVML requires Intel's
  # proprietary SVML library and MKL requires the oneAPI MKL SDK, neither of
  # which this workflow installs; validate those locally
  # (`setup.py config.build.test.svml` / `.mkl`) where the SDK is available.
  # ---------------------------------------------------------------------------
  optional-backends:
    name: Optional / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: sleef-neon
            os: macos-latest
            cmake_flags: --cpu-backend=neon --sleef=ON
          - name: accelerate-neon
            os: macos-latest
            cmake_flags: --cpu-backend=neon --accelerate=ON
          - name: native-arch
            os: ubuntu-latest
            cmake_flags: --cpu-backend=avx2 --native-arch=ON
          - name: packet-size-4
            os: ubuntu-latest
            cmake_flags: --cpu-backend=avx2 --packet-size=4
          - name: sve-256
            os: ubuntu-latest
            cmake_flags: --cpu-backend=sve --sve-vector-bits=256
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure
        run: >
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --source-dir . --build-dir build --generator Ninja
          --build-type=Release
          --gpu-backend=none
          --testing=ON
          --benchmark=OFF
          ${{ matrix.cmake_flags }}

      - name: Build
        run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build

      - name: Test
        run: python3 "${{ github.workspace }}/Scripts/setup.py" test --build-dir . --build-dir build

  # ---------------------------------------------------------------------------
  # Toolchain axes: LTO mode, linker choice, C++ standard, compiler cache.
  # Independent, cheap knobs -- each gets its own small matrix entry rather
  # than a combinatorial cross product with the CPU/GPU backend matrices.
  # ---------------------------------------------------------------------------
  toolchain-axes:
    name: Toolchain / ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CC: clang
      CXX: clang++
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: lto-thin
            cmake_flags: --lto-mode=thin
          - name: lto-full
            cmake_flags: --lto-mode=full
          - name: cxx17
            cmake_flags: --cxx-standard=17
          - name: cxx23
            cmake_flags: --cxx-standard=23
          - name: linker-lld
            cmake_flags: --linker-choice=lld
          - name: cache-ccache
            cmake_flags: --cache=ON --cache-backend=ccache
            install: ccache
          - name: static-libs
            cmake_flags: --shared=OFF
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja + lld
        run: sudo apt-get update && sudo apt-get install -y ninja-build lld

      - name: Install ${{ matrix.install }}
        if: matrix.install
        run: sudo apt-get install -y ${{ matrix.install }}

      - name: Configure
        run: >
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --source-dir . --build-dir build --generator Ninja
          --build-type=Release
          --cpu-backend=avx2
          --gpu-backend=none
          --testing=ON
          --benchmark=OFF
          ${{ matrix.cmake_flags }}

      - name: Build
        run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build

      - name: Test
        run: python3 "${{ github.workspace }}/Scripts/setup.py" test --build-dir . --build-dir build

  # ---------------------------------------------------------------------------
  # Compiler cache + Icecream, cross-platform: toolchain-axes above only covers
  # ccache on Linux. This job exercises VECTORIZATION_ENABLE_CACHE (ccache,
  # sccache) and VECTORIZATION_ENABLE_ICECC on Linux, macOS, and Windows.
  # BuildCache runs in buildcache.yml. Icecream has no Windows port, so icecc is
  # Linux/macOS only.
  # ---------------------------------------------------------------------------
  cache-icecc:
    name: Cache/Icecc / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-ccache
            os: ubuntu-latest
            cmake_flags: --cache=ON --cache-backend=ccache
          - name: linux-sccache
            os: ubuntu-latest
            cmake_flags: --cache=ON --cache-backend=sccache
            use_sccache_action: true
          - name: linux-icecc
            os: ubuntu-latest
            cmake_flags: --icecc=ON
          - name: macos-ccache
            os: macos-latest
            cmake_flags: --cache=ON --cache-backend=ccache
          - name: macos-sccache
            os: macos-latest
            cmake_flags: --cache=ON --cache-backend=sccache
            use_sccache_action: true
          - name: macos-icecc
            os: macos-latest
            cmake_flags: --icecc=ON
          - name: windows-ccache
            os: windows-latest
            cmake_flags: --cache=ON --cache-backend=ccache
          - name: windows-sccache
            os: windows-latest
            cmake_flags: --cache=ON --cache-backend=sccache
            use_sccache_action: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja + ccache + icecc (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build ccache icecc

      - name: Install ccache + icecream (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja ccache icecream

      - name: Install ccache (Windows)
        if: runner.os == 'Windows'
        run: choco install -y ccache

      - uses: mozilla-actions/sccache-action@v0.0.9
        if: matrix.use_sccache_action
        with:
          version: v0.12.0

      - name: Configure (Linux/macOS)
        if: runner.os != 'Windows'
        run: >
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --source-dir . --build-dir build --generator Ninja
          --build-type=Release
          --cpu-backend=avx2
          --gpu-backend=none
          --testing=ON
          --benchmark=OFF
          ${{ matrix.cmake_flags }}

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: >
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --generator=default --source-dir . --build-dir build
          --cpu-backend=avx2
          --gpu-backend=none
          --testing=ON
          --benchmark=OFF
          ${{ matrix.cmake_flags }}

      - name: Build (Linux/macOS)
        if: runner.os != 'Windows'
        run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build --build-type Release

      - name: Test (Linux/macOS)
        if: runner.os != 'Windows'
        run: python3 "${{ github.workspace }}/Scripts/setup.py" test --build-dir . --build-dir build

      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: python3 "${{ github.workspace }}/Scripts/setup.py" test --build-dir . --build-dir build --build-type Release

  # ---------------------------------------------------------------------------
  # Static analysis: clang-tidy and include-what-you-use, each their own job
  # so a failure in one doesn't mask the other. Default CPU backend (avx2),
  # GPU backend none.
  # ---------------------------------------------------------------------------
  static-analysis:
    name: Static analysis / ${{ matrix.tool }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CC: clang
      CXX: clang++
    strategy:
      fail-fast: false
      matrix:
        include:
          - tool: clang-tidy
            cmake_flags: --clangtidy=ON
            install: clang-tidy
          - tool: iwyu
            cmake_flags: --iwyu=ON
            install: iwyu
          - tool: cppcheck
            cmake_flags: ""
            install: cppcheck
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja + ${{ matrix.install }}
        run: sudo apt-get update && sudo apt-get install -y ninja-build ${{ matrix.install }}

      - name: Configure
        if: matrix.tool != 'cppcheck'
        run: >
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --source-dir . --build-dir build --generator Ninja
          --build-type=Release
          --cpu-backend=avx2
          --gpu-backend=none
          --testing=OFF
          --benchmark=OFF
          ${{ matrix.cmake_flags }}

      - name: Build (clang-tidy / iwyu run inline during compilation)
        if: matrix.tool != 'cppcheck'
        run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build

      - name: Cppcheck (via Scripts/setup.py)
        if: matrix.tool == 'cppcheck'
        run: |
          cd Scripts
          python3 setup.py config.build.avx2.cppcheck

  # ---------------------------------------------------------------------------
  # Valgrind: default CPU backend, Debug, executes the test suite under
  # Valgrind memory checking. Linux only (Cmake/tools/valgrind.cmake).
  # ---------------------------------------------------------------------------
  valgrind:
    name: Valgrind
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja + Valgrind
        run: sudo apt-get update && sudo apt-get install -y ninja-build valgrind

      - name: Configure
        run: >
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --source-dir . --build-dir build --generator Ninja
          --build-type=Debug
          --cpu-backend=avx2
          --gpu-backend=none
          --testing=ON
          --benchmark=OFF
          --valgrind=ON

      - name: Build
        run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build

      - name: Test under Valgrind
        run: python3 "${{ github.workspace }}/Scripts/setup.py" test --build-dir . --build-dir build

  # ---------------------------------------------------------------------------
  # Bazel: builds/tests the whole tree, cross-platform, plus a small CPU
  # backend + Metal smoke matrix exercising bazel/BUILD.bazel's select()
  # logic (see bazel/vectorization.bzl). CUDA/HIP are not exercised here --
  # see Scripts/setup_bazel.py's module docstring (@local_config_{cuda,hip}
  # is not yet defined in this workspace).
  # ---------------------------------------------------------------------------
  bazel:
    name: Bazel / ${{ matrix.os }} / ${{ matrix.cpu_backend }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        cpu_backend: [no]
        include:
          - os: ubuntu-latest
            cpu_backend: avx2
          - os: macos-latest
            cpu_backend: neon
          - os: macos-latest
            cpu_backend: metal
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: bazelbuild/setup-bazelisk@v3

      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel
          key: bazel-${{ runner.os }}-${{ matrix.cpu_backend }}-${{ hashFiles('MODULE.bazel', 'WORKSPACE.bazel', 'BUILD.bazel', 'bazel/**') }}
          restore-keys: |
            bazel-${{ runner.os }}-${{ matrix.cpu_backend }}-
            bazel-${{ runner.os }}-

      - name: Build (default backend)
        if: matrix.cpu_backend == 'no'
        run: python3 "${{ github.workspace }}/Scripts/setup_bazel.py" build --compiler=default --compilation-mode=fastbuild --target=//...

      - name: Test (default backend)
        if: matrix.cpu_backend == 'no'
        run: python3 "${{ github.workspace }}/Scripts/setup_bazel.py" test --compiler=default --compilation-mode=fastbuild --target=//... --test-output=errors

      - name: Build (CPU backend)
        if: matrix.cpu_backend != 'no' && matrix.cpu_backend != 'metal'
        run: python3 "${{ github.workspace }}/Scripts/setup_bazel.py" build --compiler=default --compilation-mode=fastbuild --target=//... --cpu-backend=${{ matrix.cpu_backend }}

      - name: Test (CPU backend)
        if: matrix.cpu_backend != 'no' && matrix.cpu_backend != 'metal'
        run: python3 "${{ github.workspace }}/Scripts/setup_bazel.py" test --compiler=default --compilation-mode=fastbuild --target=//... --cpu-backend=${{ matrix.cpu_backend }} --test-output=errors

      - name: Build (Metal GPU backend)
        if: matrix.cpu_backend == 'metal'
        run: python3 "${{ github.workspace }}/Scripts/setup_bazel.py" build --compiler=default --compilation-mode=fastbuild --target=//... --gpu-backend=metal

      - name: Test (Metal GPU backend)
        if: matrix.cpu_backend == 'metal'
        run: python3 "${{ github.workspace }}/Scripts/setup_bazel.py" test --compiler=default --compilation-mode=fastbuild --target=//... --gpu-backend=metal --test-output=errors

  # ---------------------------------------------------------------------------
  # Sanitizers: Clang ASan and UBSan, default CPU backend (avx2), Debug.
  # Linux + macOS only -- Cmake/tools/sanitize.cmake requires Clang/GCC and
  # explicitly warns "Sanitizers require GCC or Clang" for MSVC, so Windows
  # is skipped (unsupported by the codebase's own sanitizer module, not a CI
  # gap).
  # ---------------------------------------------------------------------------
  sanitize:
    name: Sanitizer / ${{ matrix.os }} / ${{ matrix.sanitizer }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        sanitizer: [address, undefined]
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure
        run: >
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --source-dir . --build-dir build --generator Ninja
          --build-type=Debug
          --cpu-backend=avx2
          --gpu-backend=none
          --testing=ON
          --benchmark=OFF
          --sanitizer=ON
          --sanitizer-types=${{ matrix.sanitizer }}

      - name: Build
        run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build

      - name: Test
        env:
          ASAN_OPTIONS: halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: python3 "${{ github.workspace }}/Scripts/setup.py" test --build-dir . --build-dir build

  # ---------------------------------------------------------------------------
  # Coverage: gcc/gcov+lcov (Linux), Homebrew LLVM/clang (macOS), MSVC/OpenCppCoverage
  # (Windows). Pass --compiler explicitly: macOS's default /usr/bin/c++ is AppleClang
  # with CMAKE_CXX_COMPILER=/usr/bin/c++, and coverage-tool cannot map that path
  # (no "clang" in the filename) when CMAKE_CXX_COMPILER_ID is not a cache entry.
  # Default CPU backend (avx2), GPU backend none. Codecov upload stays Linux/lcov-only.
  # ---------------------------------------------------------------------------
  coverage:
    name: Coverage / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CC: ${{ matrix.os == 'ubuntu-latest' && 'gcc' || '' }}
      CXX: ${{ matrix.os == 'ubuntu-latest' && 'g++' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install tools (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y ninja-build lcov

      - name: Install tools (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install ninja llvm
          LLVM_PREFIX="$(brew --install-prefix llvm)"
          echo "${LLVM_PREFIX}/bin" >> "$GITHUB_PATH"
          echo "CC=${LLVM_PREFIX}/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=${LLVM_PREFIX}/bin/clang++" >> "$GITHUB_ENV"

      - name: Install tools (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install -y opencppcoverage

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install coverage-tool
        run: pip install "git+https://github.com/KhwarizmiAnalytix/coverage-tool.git"

      - name: Configure (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: >
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --source-dir . --build-dir build --generator Ninja
          --build-type=Debug
          --cpu-backend=avx2
          --gpu-backend=none
          --testing=ON
          --benchmark=OFF
          --coverage=ON

      - name: Configure (Windows)
        if: matrix.os == 'windows-latest'
        run: >
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --generator=default --source-dir . --build-dir build
          --cpu-backend=avx2
          --gpu-backend=none
          --testing=ON
          --benchmark=OFF
          --coverage=ON

      - name: Build (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build --build-type Release

      - name: Test (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: python3 "${{ github.workspace }}/Scripts/setup.py" test --build-dir . --build-dir build

      - name: Test (Windows)
        if: matrix.os == 'windows-latest'
        run: python3 "${{ github.workspace }}/Scripts/setup.py" test --build-dir . --build-dir build --build-type Release

      - name: Collect coverage
        run: >
          coverage-tool --build=build
          --compiler=${{ matrix.os == 'windows-latest' && 'msvc' || (matrix.os == 'macos-latest' && 'clang' || 'gcc') }}

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-${{ matrix.os }}
          path: build/coverage_report/html

      - name: Upload to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          files: build/coverage_filtered.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
